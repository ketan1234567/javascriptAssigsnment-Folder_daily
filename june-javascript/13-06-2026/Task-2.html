<body>

    <script>
     function delay(ms){
   return new Promise((resolve, reject) => {
    setTimeout(() => {
        resolve("delay_promise")
    }, ms);
   })
     }

delay(2000).then(()=>{
    console.log("2 second Completed");
    
})
    </script>

</body>
