    <script>
        async function fetchMultipleUsers(ids){
            const promises= await ids.map(async(ids)=>{
                const data= await fetch(ids)

                if (!data.ok) {
                    throw new Error("failed api",ids);
                    
                }

                return data.json()

            })

            const result= await Promise.all(
                promises
            )

            result.forEach((Element)=>{
            console.log(Element);
            
                //return Element
            })

      
            
        }

        fetchMultipleUsers(["https://jsonplaceholder.typicode.com/users/1",

"https://jsonplaceholder.typicode.com/users/3"]
)
     
    </script>
