<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function getUsers() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve("Users Loaded")
                }, 1000);
            })
        }

                function getPosts() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve("Posts Loaded")
                }, 2000);
            })
        }
                function getComments() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve("Comments Loaded")
                }, 3000);
            })
        }


      async   function allDatashow() {
            try {
                const result=await Promise.all([
                    getUsers(),
                    getPosts(),
                    getComments()

                ])
    
                

                console.log(result + "All Data Loaded");
 

                
            } catch (error) {
                console.log(error);
                
                
            }
        }

        allDatashow()
    </script>
    
</body>
</html>
