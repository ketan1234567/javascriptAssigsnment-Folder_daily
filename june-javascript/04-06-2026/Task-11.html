    <script>


function loginUser(username) {

    return new Promise((resolve, reject) => {
        if (username) {
        resolve({id:1,username:username})
        } else {
            reject("You have to first Login User+11111111")
        }
    })
    
}


function fetchProfile(user){
    return new Promise((resolve, reject) => {
        if (user.username) {
        resolve({...user,Addres:"sai Vihar Udgit",Phone:9970166981})
        } else {
            reject("You have to first Login User+2222")
        }
    })

    
}

function fetchOrders(user)
{

        return new Promise((resolve, reject) => {

        resolve({...user,Produt_id:1,Produt_name:"samsung"})
    
    })
    
}
 function fetchNotifications(user) {

            return new Promise((resolve, reject) => {
    
        resolve({...user,Notification:"Fetched_new_Notification"})
   
    })
    
 }

async function allShow() {
    try {
const demo1= await loginUser("ketan")
