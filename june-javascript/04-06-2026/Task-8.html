<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

  <ul id="demo" ></ul>


    <script>
const users = [
 {id:1,name:"Ketan"},
 {id:2,name:"Rahul"},
 {id:3,name:"Anil"}
];


const result=users.map((item)=>{
return `<li>${item.name}</li>`
}).join("")

document.getElementById("demo").innerHTML=result;

    </script>

</body>

</html>
