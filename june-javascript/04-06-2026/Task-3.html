<!DOCTYPE html>
<html lang="en">

<head>

<body>
    <script>
        function fetchStudent(id) {
            return new Promise((resolve, reject) => {
                if (id) {
                    resolve([
                        { id: 1, name: "ketan", marks: 10 },
                        { id: 2, name: "anil", marks: 20 },
                        { id: 3, name: "vishal", marks: 30 },
                        { id: 4, name: "ashia", marks: 40 },
                        { id: 5, name: "vinu", marks: 70 }
                    ]

                    )

                } else {

                }
            })
        }


        async function showAllUsers() {
            try {
                const ids = [1,2,3,4];

                const result= await Promise.all(
                    ids.map(id=> fetchStudent(id)
                    )
                )
result.flat()  // when we used flat array when we used while we have nested array 


               const response=result.flat()

              const student = response.find(item => item.id === 5);
              console.log(student);
              

            } catch (error) {
                console.log(error);
                
                
            }
            
        }
showAllUsers()


    </script>

</body>

</html>
