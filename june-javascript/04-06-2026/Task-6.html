<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
     async function retryApi( maxAttempt) {
      for (let attempt = 1; attempt <=maxAttempt; attempt++) {
      try {
        const data= await fetch("https://jsonplaceholder.typicode.com/posts");
   
        
        if (data.status !==200) {
              throw new Error("API Failed");
        } else {
          const response = await data.json();
          return response;
        }

      } catch (error) {

        console.log("failed api",attempt);

        if (attempt===maxAttempt) {
              console.log(`we have tried ${maxAttempt} For This Api`);
        } 
      }
        
      }

     }
retryApi(3).then((value)=>{
  console.log(value);
  
})
    </script>

</body>

</html>
