    <script>
        function login(user) {
            return new Promise((resolve, reject) => {
                if (user) {
                    console.log("Login Success");
                    resolve({username:user})
                } else {
                    reject("Username should not be Empty")
                }
               
            })

            
        }
        function getProfile(user) {
            return new Promise((resolve, reject) => {
                if (user.username) {
                                     console.log("Profile Loaded");
                    resolve({...user,Full_Name:"Ketan_Deshmukh",Address:"Sai Vihar Udgir"})
                } else {
                    reject("First You have to Login")
                    
                }
            })

            
        }

     function getSettings(user){
        return new Promise((resolve, reject) => {
            if (user.Full_Name) {
                  console.log("Settings Loaded");
                
                resolve({...user,Setting:"Get Setting only show this data"})
            } else {
                reject("you have to first login data")
                
            }
        })
     }


     async function allUserShowData() {
