    <script>
        function fastServer(){
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                     let req=null
                    if (req==true) {
                        resolve("fast server ")
                    } else {
                        reject("fast api failed_server")
                    }
                }, 1000);
            })
        }

             function slowserver(){
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    let req=null
                     if (req==false) {
                        resolve("slow Server")
                    } else {
                        reject("failed_server_slower")
                    }
                    
                }, 2000);
            })
        }


        async function showAllusers() {
           const result= await   Promise.race([
            new fastServer(),
            new slowserver()
        ])
 
        }
     
      
showAllusers().then((value)=>{
 console.log(value);

    </script>
