<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <script>


    async function getUsers() {
      try {
        const data = await fetch("https://jsonplaceholder.typicode.com/users/")
        const response = await data.json()
        //console.log(response);
        const result = response.map((value) => {
             //console.log(value);
             return{
              users:value
             }
        })
        return result

      } catch (error) {
        console.log(error);

      }

    }

   
async function getPost() {
        try {
        const post = await fetch("https://jsonplaceholder.typicode.com/posts/")
        const response = await post.json()
        //console.log(response);
        const result = response.map((value) => {
             //console.log(value);
             return{
              post:value
             }
        })
        return result

      } catch (error) {
        console.log(error);

      }
}

async function getComments() {
        try {
        const comments = await fetch("https://jsonplaceholder.typicode.com/comments")
        const response = await comments.json()
        //console.log(response);
        const result = response.map((value) => {
            // console.log(value);
             return{
              comments:value
             }
        })
        return result

      } catch (error) {
        console.log(error);

      }
}

async function showAllusers() {
  try {
    const [demo1,demo2,demo3]= await Promise.all([
      getUsers(),
      getPost(),
      getComments()

    ])

    return{
      Users:demo1,
      Post:demo2,
      Comments:demo3
    }

    // console.log(demo1);
    //  console.log(demo2);
    //   console.log(demo3);
    
    
  } catch (error) {
    console.log(error);
    
    
  }
  
}
showAllusers().then((value)=>{
  console.log(value);
  
})
  </script>

</body>

</html>
