<!DOCTYPE html>
<html lang="en">

<body>

  <script>
   function delay(ms) {
    return new Promise((resolve, reject) => {
        setTimeout(() => {
            console.log("Done");
            
        }, ms);
    })
}
delay(2000).then((value)=>[
    console.log(value)
    
]).catch((error)=>{
  console.log(error);
  
})
  </script>

</body>

</html>
