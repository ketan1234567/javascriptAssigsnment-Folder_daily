    <script>
// Given:
function readFile(path){
    return new Promise((reslove,reject)=>{
        setTimeout(()=>{
            reslove({path,content:"Hello Ketan"})
        },800)

    })
}

function validateFile(file){
    return new Promise((reslove,reject)=>{
        setTimeout(()=>{
            const isValid=file.content.length>0;
            reslove({...file,valid:isValid})
        },500)
    })
}

function compressFile(file){
    return new Promise((reslove,reject)=>{
        setTimeout(()=>{
reslove({...file,compressed:true,size:file.content.length*0.5})
        },1200)
    })
}

function uploadFile(file){
    return new Promise((reslove,reject)=>{
        setTimeout(()=>{
            reslove({...file,url:"https://cdn.example.com/file.dat"})
        },1000)
    })
}

readFile('/data/doc.txt').then((file)=>{

}).then((file)=>{

}).then((file)=>{
