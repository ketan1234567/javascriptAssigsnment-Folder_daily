    <script>

     async function fetch_user(){
         try {
            const data= await fetch("https://jsonplaceholder.typicode.com/posts");
            const respone= await data.json();
           // console.log(respone);

            const result=respone.map(function(value,i,arr){
               if (value.id<5) {
                 // console.log(value);

                document.getElementById("demo").innerHTML=  `
                   <ul>
                     <li>${value.id}</li>
                     <li>${value.title}</li>
                     <li>${value.body}</li>

                  </ul>
                  
 
                  `

               }

            });
            
            
         } catch (error) {
            console.log(error);
            
            
         }
      }

      

fetch_user()
