<script>

    async function users() {
        try {
            const users = await fetch("https://jsonplaceholder.typicode.com/users")
            const totla_data = await users.json()
            const resp = totla_data.length
            return resp
            //console.log(resp);
        } catch (error) {
            console.log(error);
        }
    }

    users()

    async function posts() {

        try {
            const posts = await fetch("https://jsonplaceholder.typicode.com/posts")
            const totla_data_p = await posts.json()
            const respo = totla_data_p.length
            //console.log(respo);
            return respo
        } catch (error) {
            console.log(error);
        }
    }
    posts()


    async function comments() {

        try {
            const comments = await fetch("https://jsonplaceholder.typicode.com/posts")
            const totla_data_c = await comments.json()
            const respc = totla_data_c.length
          return respc
        } catch (error) {
            console.log(error);
        }
    }

    comments()


    async function AllShowUsers() {
        try {

            const [main,post_count,comments_count]= await Promise.all([
                users(),
                posts(),
                comments()
            ])

            const response=main+post_count+comments_count
            console.log(response);
            

            
        } catch (error) {
            console.log(error);
            
            
        }
        
    }

    AllShowUsers()

</script>
