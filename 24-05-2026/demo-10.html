<script>
    function addToCart(user_id,name,price,quantity){
      return  new Promise((resolve, reject) => {
        if (quantity !==0) {
            resolve({user_id:user_id,name:name,price:price,quantity:quantity})
            
        } else {
            reject("You have to add to cart atleast one item")
            
        }
            
        })

    }

    function createOrder(user){
      return new Promise((resolve, reject) => {
        if (user.quantity > 0) {
            resolve({...user,order:"Order created Sucessfully"})
        } else {
            reject("You have to add first Cart item")
        }
        
          
        })
        


    }


   function payment(user){
    return new Promise((reslove,reject)=>{
        if (user.order) {
            reslove({...user,payment:"your payment Sucessfully"})
        } else {
            reject("you have to first order create")
        }
    })

    }


    addToCart(1,"ketan",300,1).then((value)=>{
        return value
    }).then((value)=>{
        return createOrder(value)
    }).then((value)=>{
        return payment(value)
    }).then((value)=>{
        console.log(value);
        
    }).catch((Error)=>{
        console.log(Error);
        
    })
