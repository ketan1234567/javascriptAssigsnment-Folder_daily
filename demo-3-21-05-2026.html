<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

async function  fetch_user(){
    try {
        const user= await fetch("https://jsonplaceholder.typicode.com/users");
         const res= await user.json();
         const result=res
         .filter(item=>item.id>5)
         .map(item=>item)
         .reduce((acc,curr)=>{
  return curr
         },[])
            
         
       
        
        console.log(result);
        
    } catch (error) {
        console.log(error);
        
        
    }
}
      
fetch_user()
        
    </script>
</head>
<body>
    <h1>Simulate an API retry mechanism using async/await.</h1>
</body>
</html>
