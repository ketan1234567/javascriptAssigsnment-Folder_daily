function getCart(userId) {

  return new Promise((resolve,reject)=>{
    setTimeout(()=>{
  resolve({ items: [{ name: "Laptop", price: 50000 }] })
    },1000)
  })
    
}

function applyDiscount(cart) {

  return new Promise((resolve,reject)=>{
    setTimeout(()=>{
       cart.items.forEach(i => i.price *= 0.9);//10 0ff
    resolve(cart)
    },1000)
  })

}

function processPayment(cart) {

  return new Promise((resolve,reject)=>{

    setTimeout(()=>{
    resolve({ ...cart, paymentId: "PAY_123", status: "paid" })
    },1500)
})
}

function sendConfirmation(order) {
  return new Promise((resolve,reject)=>{

    setTimeout(()=>{
    resolve([{ ...order, message: "Order confirmed!" }])
    },500)
  
    
})
}
