    <script>
const products = [
  {id:1, price:100},
  {id:2, price:200},
  {id:3, price:300}
];

const result=products
.map(item=>item.price)
.reduce((acc,curr)=>{
  return acc+curr
})





const avarage=result/products.length

console.log(`Total Price ${result}`);

console.log(`Average Price ${avarage}`);

              
    </script>
</body>
