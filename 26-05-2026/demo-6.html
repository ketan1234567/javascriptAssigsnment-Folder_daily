<script>
 async function retryApi(maxAttempts) {
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      const data = await fetch("https://dummy.restapiexample.com/api/v1/employees");
      const result = await data.json();

      if (result.status === "success") {
        console.log("Data successfully fetched on attempt", attempt);
        return result;
      } else {
        throw new Error("API returned failure status");
      }
    } catch (error) {
      console.log("Attempt failed:", attempt);

      if (attempt === maxAttempts) {
        throw new Error("Maximum attempts exceeded");
      }
    }
  }
}

retryApi(3).then(console.log).catch(console.log);
   
</script>

</html>
