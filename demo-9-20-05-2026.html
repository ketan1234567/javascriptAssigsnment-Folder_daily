async function authenticate_user(params) {
   return new Promise((resolve, reject) => {
      setTimeout(() => {
         resolve({name:params})
      }, 1000);
   })
   
}
async function load_dashboard_data() {
   return new Promise((resolve, reject) => {
      setTimeout(() => {
         resolve("Load_Dashboard_ata")
      }, 1000);
   })
   
}

async function load_notifications() {
   return new Promise((resolve, reject) => {
       setTimeout(() => {
          resolve("load_notification_data")
       }, 1000);
   })
   
}
async function show_loading() {
   try {
      const user= await authenticate_user("vishal")

      const result=Promise.allSettled(

      console.log(result);

}

show_loading().then((value)=>{
