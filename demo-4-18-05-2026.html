function getUser() {
    return new Promise((resolve, reject) => {
        setTimeout(() => {
            resolve({ id: 1, name: "Aarav" });
        }, 1000);
    });
}

function getProfile(user) {
    return new Promise((resolve,reject)=>{
        setTimeout(()=>{
resolve({ ...user, age: 25, city: "Mumbai" })
        },1000)
    })

}


function getAvatar(profile) {
  return new Promise((resolve,reject)=>{
  setTimeout(()=>{
resolve({ ...profile, avatar: "aarav.png" })
  },1000)
  })
}
