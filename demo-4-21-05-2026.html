<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        async function  retry_Logic(maxAttempts) {
            for (let attempt = 0; attempt <= maxAttempts; attempt++) {
            try {
                const data = await fetch("https://jsonplaceholder.typicode.com/user");
       

                console.log("success of Attempt",attempt);

                return data
                
        
                
            } catch (error) {
                console.log("Attempt is Failed",attempt);
                
              if (attempt===maxAttempts) {
                throw new Error("All retries Failed");
                
              }
                
            }
        }
            
        }


        retry_Logic(3)
    </script>
</head>
<body>
    <h1>This is for retry logic mechanisam </h1>
</body>
</html>
