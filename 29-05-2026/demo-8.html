<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<ul id="demo"></ul>

    <script>


const users = [];

for(let i=0;i<10000;i++){

}

document.getElementById("demo").innerHTML += users.join("");


    </script>
