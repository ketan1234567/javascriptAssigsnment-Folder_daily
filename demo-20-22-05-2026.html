  <script>


    function login() {
      return new Promise((reslove,reject)=>{
        setTimeout(() => {
          reslove({user:"Ketan"})
        }, 1000);
      })


    }
    function fetchProfile(user) {
            return new Promise((reslove,reject)=>{
        setTimeout(() => {
          reslove({...user, profile:"Developer",})
        }, 1000);
      })

    }
    function fetchMessages(user) {

                  return new Promise((reslove,reject)=>{
        setTimeout(() => {
          reslove({...user, message:["Hi","Welcome"],})
        }, 1000);
      })
      

    }
    function logout() {
      return new Promise((resolve, reject) => {
        resolve("Logout ")
      });

    }

    async function showallprofile() {
      try {

        const profile= await fetchProfile(data)
        const message= await fetchMessages(profile)

        console.log(error);
        
        
      }

      
    }
