<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
     function delay(params){
        return new Promise((resolve, reject) => {
            setTimeout(() => {
                console.log("This is run for Custom Delay Function");
                
            },params);
        })
     }

     delay(2000);
    
    </script>
</head>
<body>
    <h1>delay Function we used</h1>
</body>
</html>
