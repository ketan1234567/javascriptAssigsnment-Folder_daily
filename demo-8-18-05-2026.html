function authenticate(pin){
    return new Promise((reslove,reject)=>{
        setTimeout(()=>{
            if (pin==="1234") {
                reslove({useid:1,authenticate:true})
            } else {
                   reslove({useid:null,authenticate:false})
            }

        },800)

    })
}

function getBalance(user){
    return new Promise((reslove,reject)=>{
        setTimeout(()=>{
       reslove({...user,balance:50000})

        },600)
    })

}

function transfer(user,amount){
 return new Promise((reslove,reject)=>{
    setTimeout(()=>{
        if (user.balance>=amount) {
            reslove({...user,balance:user.balance-amount,transfered:amount})
        } else {
            reject({...user,error:"Insufficiant_Balance"})
        }

    },1000)
 })
}

function sendNotification(user){
return new Promise((reslove,reject)=>{
    setTimeout(()=>{
     reslove({...user,Notification:true})
    },6000)
})
}

authenticate("1234").then(
    (pin)=>{
        return getBalance(pin) 
    }).then((user)=>{

        if (user.error) {

        return transfer(user,20000)
