<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
function delay(ms) {
    return new Promise((resolve, reject) => {
        setTimeout(() => {
            resolve("Done after " + ms + " ms");
        }, ms);
    });
}

console.log("start");

delay(1000)
    .then((result) => {
        console.log(result);
    })
    .catch((err) => {
        console.log(err);
    });

console.log("END");
   
    </script>
</head>
